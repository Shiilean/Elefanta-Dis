<style>
  :root{
    --teal:#7fc4c9; --teal-dark:#5a9ba0; --teal-light:#a9dadd;
    --mint:#d9ede2; --mint-line:#bcdcc9;
    --tan:#b49e7e; --tan-dark:#a08a68;
    --text:#4a5a5c; --bg:#eef7f6; --card:#ffffff;
    --shadow:0 2px 8px rgba(90,155,160,.12);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg)}
  .topbar{
    background:var(--teal);color:#fff;display:flex;align-items:center;gap:12px;
    padding:10px 16px;box-shadow:var(--shadow);position:sticky;top:0;z-index:10;flex-wrap:wrap;
  }
  .topbar img{height:40px;width:auto;display:block}
  .brand{font-family:'Caveat',cursive;font-size:30px;line-height:1;font-weight:700}
  .sub{font-size:13px;opacity:.9;margin-left:2px}
  .spacer{flex:1}
  .upd{font-size:12px;opacity:.9;white-space:nowrap}
  .wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px}
  h1.title{font-family:'Caveat',cursive;color:var(--teal-dark);font-weight:700;font-size:40px;margin:6px 0 4px;text-align:center}
  .lead{text-align:center;color:var(--text);opacity:.8;margin:0 0 20px;font-size:14px}
  .card{background:var(--card);border:1px solid #e6eceb;border-radius:12px;padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:13px;font-weight:600;color:var(--teal-dark);margin:0 0 6px}
  select,input{
    width:100%;padding:12px;border:1px solid #d7dede;border-radius:8px;font-size:16px;
    color:var(--text);background:#fff;
  }
  select:focus,input:focus{outline:none;border-color:var(--teal)}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row>div{flex:1;min-width:200px}
  .summary{
    display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 14px;
  }
  .chip{
    background:var(--mint);border:1px solid var(--mint-line);border-radius:999px;
    padding:8px 16px;font-size:14px;font-weight:600;color:var(--teal-dark);
  }
  .chip b{color:var(--text)}
  table{width:100%;border-collapse:collapse;font-size:15px}
  .tablebox{overflow:auto;border:1px solid #eef2f1;border-radius:8px}
  thead th{
    background:var(--teal-dark);color:#fff;text-align:left;padding:10px 12px;font-weight:600;
    position:sticky;top:0;z-index:2;
  }
  thead th.num{text-align:right}
  tbody td{padding:10px 12px;border-bottom:1px solid #eef2f1}
  tbody tr:nth-child(even){background:#f8fbfb}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  td.sku{color:#8aa0a2;font-size:13px}
  .stock{font-weight:700}
  .stock.low{color:#c0632b}
  .stock.zero{color:#b23b3b}
  .empty{text-align:center;color:#8aa0a2;padding:30px}
  .btn{
    background:var(--teal);color:#fff;border:none;border-radius:8px;padding:11px 18px;
    font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .btn:hover{background:var(--teal-dark)}
  .msg{text-align:center;padding:14px;border-radius:8px;margin:10px 0;font-size:14px}
  .msg.err{background:#fdecec;color:#b23b3b;border:1px solid #f3c9c9}
  .msg.load{background:var(--mint);color:var(--teal-dark)}
  .foot{text-align:center;font-size:12px;color:#9ab0b1;margin-top:18px}
  @media(max-width:560px){
    .cat-col{display:none}
  }
</style>
</head>
<body>
  <div class="topbar">
    <img id="logo" alt="Elefanta">
    <div>
      <div class="brand">Elefanta</div>
    </div>
    <div class="spacer"></div>
    <div class="upd" id="upd">—</div>
  </div>

  <div class="wrap">
    <h1 class="title">Consulta de stock</h1>
    <p class="lead">Elige tu tienda para ver tus productos y las cantidades disponibles.</p>

    <div class="card">
      <div class="row">
        <div>
          <label for="store">Tienda</label>
          <select id="store"><option value="">Cargando…</option></select>
        </div>
        <div>
          <label for="q">Buscar producto o SKU</label>
          <input id="q" type="text" placeholder="Escribe para filtrar…" autocomplete="off">
        </div>
      </div>
      <div style="margin-top:12px;text-align:right">
        <button class="btn" id="refresh">Actualizar</button>
      </div>
    </div>

    <div id="status"></div>

    <div class="card" id="resultCard" style="display:none">
      <div class="summary">
        <span class="chip"><b id="cProd">0</b> productos</span>
        <span class="chip"><b id="cUnits">0</b> unidades</span>
      </div>
      <div class="tablebox">
        <table>
          <thead>
            <tr>
              <th>Producto</th>
              <th>SKU</th>
              <th class="cat-col">Categoría</th>
              <th class="num">Stock</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <div class="foot">Elefanta Diseño · Esta vista es solo de consulta. No muestra precios ni permite modificar datos.</div>
  </div>

<script>
const URL='https://script.google.com/macros/s/AKfycbzf9h4H5HChQ_j87qVjB2z4jza7awnkmwky1qACxiOaAPJrxAqIQVrqkmOV6H8fYEVj/exec';
const KEY='Elefantadis1';
const LOGO_SRC=document.querySelector('link[rel="icon"][type="image/png"]').href;
document.getElementById('logo').src=LOGO_SRC;

let ALL=[];     // [{name,sku,cat,store,stock}]
let STORES=[];

const norm=s=>String(s==null?'':s).toLowerCase()
  .normalize('NFD').replace(/[̀-ͯ]/g,'').trim();

function setStatus(html,cls){
  const el=document.getElementById('status');
  el.innerHTML = html ? '<div class="msg '+(cls||'')+'">'+html+'</div>' : '';
}

async function fetchStock(){
  // 1) intento el punto "solo stock" (oculta precios en el servidor)
  try{
    const r=await fetch(URL+'?action=stockview&key='+encodeURIComponent(KEY));
    const j=await r.json();
    if(j && j.ok && Array.isArray(j.items)){
      return {items:j.items, stores:j.stores||[]};
    }
  }catch(e){ /* sigo al plan B */ }
  // 2) respaldo: cargo la base y me quedo SOLO con el stock
  const r=await fetch(URL+'?action=load&key='+encodeURIComponent(KEY));
  const j=await r.json();
  if(!j || !j.ok || !j.db) throw new Error(j && j.error ? j.error : 'sin datos');
  const db=j.db;
  const items=(db.products||[]).map(p=>({
    name:p.name, sku:p.sku||'', cat:p.cat||'', store:p.store, stock:Number(p.stock)||0
  }));
  return {items, stores:(db.stores||[])};
}

function fillStores(){
  const sel=document.getElementById('store');
  const prev=sel.value;
  const inData=[...new Set(ALL.map(p=>p.store).filter(Boolean))];
  const list=[...new Set([...(STORES||[]), ...inData])]
    .sort((a,b)=>String(a).localeCompare(String(b),'es'));
  sel.innerHTML='<option value="">— Selecciona tu tienda —</option>'+
    list.map(s=>'<option>'+s+'</option>').join('');
  if(prev && list.includes(prev)) sel.value=prev;
}

function render(){
  const store=document.getElementById('store').value;
  const card=document.getElementById('resultCard');
  if(!store){ card.style.display='none'; return; }
  const q=norm(document.getElementById('q').value);
  let rows=ALL.filter(p=>p.store===store);
  if(q) rows=rows.filter(p=>norm(p.name).includes(q)||norm(p.sku).includes(q));
  rows.sort((a,b)=>String(a.name).localeCompare(String(b.name),'es'));

  const units=rows.reduce((s,p)=>s+(Number(p.stock)||0),0);
  document.getElementById('cProd').textContent=rows.length;
  document.getElementById('cUnits').textContent=units;

  const tb=document.getElementById('rows');
  if(!rows.length){
    tb.innerHTML='<tr><td colspan="4" class="empty">No hay productos para esta tienda'+(q?' con ese filtro':'')+'.</td></tr>';
  }else{
    tb.innerHTML=rows.map(p=>{
      const st=Number(p.stock)||0;
      const cls=st<=0?'stock zero':(st<=3?'stock low':'stock');
      return '<tr>'+
        '<td>'+esc(p.name)+'</td>'+
        '<td class="sku">'+esc(p.sku)+'</td>'+
        '<td class="cat-col">'+esc(p.cat)+'</td>'+
        '<td class="num"><span class="'+cls+'">'+st+'</span></td>'+
      '</tr>';
    }).join('');
  }
  card.style.display='';
  capHeight();
}

// Muestra máximo 20 filas; el resto queda con barra de desplazamiento dentro de la tabla.
function capHeight(){
  const box=document.querySelector('.tablebox');
  if(!box) return;
  const trs=box.querySelectorAll('tbody tr');
  const thead=box.querySelector('thead');
  if(trs.length>20 && trs[19] && trs[0] && thead){
    const headH=thead.getBoundingClientRect().height;
    const top0=trs[0].getBoundingClientRect().top;
    const bottom20=trs[19].getBoundingClientRect().bottom;
    box.style.maxHeight=Math.round(headH+(bottom20-top0)+2)+'px';
  }else{
    box.style.maxHeight='';
  }
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function load(){
  setStatus('Cargando stock…','load');
  try{
    const data=await fetchStock();
    ALL=data.items||[];
    STORES=data.stores||[];
    fillStores();
    render();
    setStatus('');
    document.getElementById('upd').textContent='Actualizado '+new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    setStatus('No se pudo cargar el stock. Revisa tu conexión a internet e intenta "Actualizar".','err');
  }
}

document.getElementById('store').addEventListener('change',render);
document.getElementById('q').addEventListener('input',render);
document.getElementById('refresh').addEventListener('click',load);
load();
setInterval(load, 30000); // se refresca solo cada 30 s
</script>
</body>
</html>
